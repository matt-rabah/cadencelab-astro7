name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so pull requests can diff against the base branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check Cloudflare Pages Functions
        run: npx tsc --noEmit -p functions/tsconfig.json

      - name: Check MCP configuration sync
        run: npm run mcp:check

      # Existing files predate the formatter, so pull requests are held to it
      # for the files they change. `npm run format:check` covers everything.
      - name: Check formatting of changed files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          if [ -s changed-files.txt ]; then
            xargs -d '\n' npx prettier --check --ignore-unknown < changed-files.txt
          fi

      # `npm run build` needs Tina Cloud credentials (Cloudflare Pages has
      # them). CI builds Tina's local client instead, which needs none.
      - name: Generate Tina client and admin (local, no credentials)
        run: npx tinacms build --local --skip-indexing --skip-cloud-checks

      - name: Type-check the site
        run: npx tsc --noEmit

      # Note: `astro check` currently does not support TypeScript 7.0.
      # Re-enable `npm run check` once @astrojs/check or ts-content-mapper supports TS 7.
      - name: Build production site and agent Markdown
        run: npx astro build && node scripts/generate-agent-markdown.mjs
