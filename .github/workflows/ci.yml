name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check Cloudflare Pages Functions
        run: npx tsc --noEmit -p functions/tsconfig.json

      - name: Check MCP configuration sync
        run: npm run mcp:check

      - name: Check formatting
        run: npm run format:check

      # Note: `astro check` currently does not support TypeScript 7.0.
      # Re-enable `npm run check` once @astrojs/check or ts-content-mapper supports TS 7.
      - name: Build production site and agent Markdown
        run: npm run build
